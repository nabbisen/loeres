# RFC 023 §11.1: excluded from the root workspace on purpose, with its own
# lockfile, so this crate's resolved dependency graph is its own evidence. See
# the root `[workspace] exclude` comment.
# RFC 023 §0.2 (Amendment 2): an empty `[workspace]` table makes this crate its
# own workspace root, so cargo's upward search for a manifest stops here. Without
# it, an extraction nested inside the repository walks past the extraction's root
# — which excludes this path — to the outer repository's manifest, which neither
# lists nor excludes it: `current package believes it's in a workspace when it's
# not`. The root `exclude` is retained; this is the stronger guarantee, since no
# enclosing workspace can absorb the example wherever the tree sits.
[workspace]

[package]
name = "cluster-qp-constrained"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Constrained quadratic program on the server path (RFC 027 example)"

# Server-side feature set from external design §1.4, minus `parallel-rayon`: the
# batch case below runs sequentially, which needs no runtime crate.
[dependencies]
loeres = { path = "../../crates/loeres", default-features = false }
loeres-cluster = { path = "../../crates/loeres-cluster", default-features = false }
loeres-backend-std = { path = "../../crates/loeres-backend-std", default-features = false, features = ["dense"] }
