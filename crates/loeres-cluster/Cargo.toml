[package]
name = "loeres-cluster"
description = "Loeres server-side solving: dynamic models, batch, orchestration, observability, and safe gateway contracts. std; server-only."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[features]
# All features are server-only. The baseline synchronous batch path is
# unconditional and runtime-agnostic; only parallel/async backends are gated.
# `ffi-gateway` must never be a default feature.
default = []
parallel-rayon = ["dep:rayon"]
async-tokio = ["dep:tokio"]
observability-tracing = []
observability-metrics = []
serde = []
ffi-gateway = []   # reserved activation gate for a future separately reviewed native/legacy adapter

[dependencies]
loeres = { workspace = true }
loeres-backend-std = { workspace = true }
rayon = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
