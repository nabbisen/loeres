[package]
name = "loeres-backend-std"
description = "Loeres dynamic dense/sparse storage and server numerical adapters. std, heap-backed; server-only."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[features]
# All features are server-only. `dense` and `sparse` are implemented by RFC 007;
# third-party adapter/serde/parallel/native-linalg features remain reserved.
default = ["dense"]
dense = []
sparse = []
serde = []
parallel-rayon = []
adapter-ndarray = []
adapter-nalgebra = []
native-linalg = []   # BLAS/LAPACK-like adapters; must never be pulled by default

[dependencies]
loeres = { workspace = true }
