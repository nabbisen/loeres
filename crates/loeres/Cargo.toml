[package]
name = "loeres"
description = "Loeres shared mathematical contracts: scalar, access, problem, solver, error, dimension. no_std, no alloc, no storage."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[features]
# Baseline is the implemented no_std / no-alloc contract surface. Optional
# `libm` and fixed-point integration hooks remain reserved/inert.
default = []
libm = []               # optional no_std math adapters for AdvancedNumericalScalar (RFC 001)
fixed-point-hooks = []  # integration hooks for fixed-point scalars (RFC 001)

[dependencies]
