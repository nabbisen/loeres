[package]
name = "loeres"
description = "Loeres shared mathematical contracts: scalar, access, problem, solver, error, dimension. no_std, no alloc, no storage."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
keywords   = ["optimization", "quadratic-program", "solver", "no-std", "math"]
categories = ["science", "mathematics", "no-std"]

[features]
# Baseline is the implemented no_std / no-alloc contract surface. `libm`
# remains reserved/inert; `fixed-point-hooks` gates the Q32 fixed-point
# scalar baseline (RFC 041).
default = []
libm = []               # optional no_std math adapters for AdvancedNumericalScalar (RFC 001)
fixed-point-hooks = []  # Q32: a saturating Q-format fixed-point BaseScalar (RFC 041)

[dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
