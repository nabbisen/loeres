schema_version = 3
fixture_id = "qp-adv-degenerate-box-two-rows-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 3
constraints = 2
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: a degenerate box with two rows. Coordinate 0 has lo == hi == 0; row x1 + x2 <= 1 is active on the free
# coordinates and row x0 - x1 <= 0.2 becomes -x1 <= 0.2.
# Q = I, step_scale 1.0.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 2.5), hi0 (multiplier 4).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [0.0, -10.0, -10.0]
upper = [0.0, 10.0, 10.0]
initial = [0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0]
center = [4.0, 3.0, 3.0]
constraint_matrix = [0.0, 1.0, 1.0, 1.0, -1.0, 0.0]
constraint_rhs = [1.0, 0.2]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [0.0, 0.5, 0.5]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
