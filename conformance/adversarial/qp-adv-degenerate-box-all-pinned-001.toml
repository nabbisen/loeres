schema_version = 3
fixture_id = "qp-adv-degenerate-box-all-pinned-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 1
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: a fully pinned box. Both coordinates have lo == hi, so the feasible set is the single point (0.3, 0.4), and
# the row x0 + x1 <= 0.7 holds with equality there (zero-volume, zero-slack).
# Q = I, step_scale 1.0.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 4.6), hi0 (multiplier 0.1).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [0.3, 0.4]
upper = [0.3, 0.4]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1.0]
center = [5.0, 5.0]
constraint_matrix = [1.0, 1.0]
constraint_rhs = [0.7]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [0.3, 0.4]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
