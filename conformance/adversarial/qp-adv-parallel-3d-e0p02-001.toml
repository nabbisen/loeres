schema_version = 3
fixture_id = "qp-adv-parallel-3d-e0p02-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 3
constraints = 3
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: nearly parallel constraint normals in three dimensions.
# Rows a1 = (1,0,0), a2 = (1,0.02,0), a3 = (1,0,0.02): three normals within atan(0.02) = 0.0200 rad of
# one another. Vertex (1,1,1) with all three rows active, multipliers (1,1,1). Q = I, step 1.0.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 1), row1 (multiplier 1), row2 (multiplier 1).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-10.0, -10.0, -10.0]
upper = [10.0, 10.0, 10.0]
initial = [0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0]
center = [4.0, 1.02, 1.02]
constraint_matrix = [1.0, 0.0, 0.0, 1.0, 0.02, 0.0, 1.0, 0.0, 0.02]
constraint_rhs = [1.0, 1.02, 1.02]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [1.0, 1.0, 1.0]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
