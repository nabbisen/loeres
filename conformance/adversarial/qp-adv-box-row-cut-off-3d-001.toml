schema_version = 3
fixture_id = "qp-adv-box-row-cut-off-3d-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 3
constraints = 2
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite (handoff 5a, F1). Stresses: a box face AND a constraint row active at the same
# optimum, so the box's Dykstra increment is exercised. n = 3, m = 2 (cluster and device); Q = I, step_scale 1.0,
# so every outer iteration projects the target itself.
# Active at the optimum: row 0, row 1 and the lower bound of coordinate 2. The target is cut off by two rows and a box face together.
# Instance: seeded pick (python random.Random(9102), attempt 6), kept only because the exact optimum has both a
# row and a box face active. It was ALSO kept only because a projection that clamps to the box without the Dykstra
# increment (simulated in pure Python, never run on a kernel) ends 0.0143 from the exact optimum on it.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 2.48806), row1 (multiplier 0.833528), lo2 (multiplier 5.00728).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-2.2, -1.4, 0.0]
upper = [0.3, 2.8, 1.4]
initial = [0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0]
center = [0.8, 5.1, -6.0]
constraint_matrix = [1.4, 1.7, -0.6, -1.8, 0.2, 0.6]
constraint_rhs = [-0.46, 2.27]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [-1.182934131736527, 0.7035928143712575, 0.0]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
