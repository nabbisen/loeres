schema_version = 3
fixture_id = "qp-adv-box-row-after-row-2d-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 2
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite (handoff 5a, F1). Stresses: a box face AND a constraint row active at the same
# optimum, so the box's Dykstra increment is exercised. n = 2, m = 2 (cluster and device); Q = I, step_scale 1.0,
# so every outer iteration projects the target itself.
# Active at the optimum: row 1 and the upper bound of coordinate 1. The target lies INSIDE the box; the first row projection carries the iterate out of it, so the box face binds
# only after the row has moved the iterate.
# Instance: seeded pick (python random.Random(9107), attempt 9988), kept only because the exact optimum has both a
# row and a box face active. It was ALSO kept only because a projection that clamps to the box without the Dykstra
# increment (simulated in pure Python, never run on a kernel) ends 0.0353 from the exact optimum on it.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row1 (multiplier 1.18056), hi1 (multiplier 0.136111).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-2.9, -1.9]
upper = [2.8, 0.3]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1.0]
center = [-1.9, 0.2]
constraint_matrix = [-0.4, -0.6, -1.2, -0.2]
constraint_rhs = [0.6, 0.52]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [-0.48333333333333334, 0.3]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
