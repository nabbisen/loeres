schema_version = 3
fixture_id = "qp-adv-box-row-cut-off-4d-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 4
constraints = 3
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite (handoff 5a, F1). Stresses: a box face AND a constraint row active at the same
# optimum, so the box's Dykstra increment is exercised. n = 4, m = 3 (cluster only (no device instantiation for this shape)); Q = I, step_scale 1.0,
# so every outer iteration projects the target itself.
# Active at the optimum: row 1 and the lower bound of coordinate 2, lower bound of coordinate 3. The target is cut off by a row and two box faces together; the largest deviation of the clamp-only projection
# among the family.
# Instance: seeded pick (python random.Random(9104), attempt 1), kept only because the exact optimum has both a
# row and a box face active. It was ALSO kept only because a projection that clamps to the box without the Dykstra
# increment (simulated in pure Python, never run on a kernel) ends 0.373 from the exact optimum on it.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row1 (multiplier 1.12759), lo2 (multiplier 1.74689), lo3 (multiplier 5.02759).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-2.3, -0.9, -1.7, -1.5]
upper = [1.5, 1.8, 2.4, 0.5]
initial = [0.0, 0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0, 1.0]
center = [0.8, -1.0, -4.8, -5.4]
constraint_matrix = [-0.2, -0.7, 1.4, 0.9, 1.1, -1.9, -1.2, 1.0, -1.7, -1.0, 1.0, -0.8]
constraint_rhs = [0.005, -2.115, 1.28]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [-0.4403526970954357, 1.1424273858921161, -1.7, -1.5]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
