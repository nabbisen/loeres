schema_version = 3
fixture_id = "qp-adv-parallel-angle-e0p05-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 2
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: nearly parallel constraint normals (RFC 027 section 11.6).
# Rows a1 = (1, 0) and a2 = (1, 0.05); the angle between the normals is atan(0.05) = 0.049958 rad.
# Family across fixtures: eps in {0.5, 0.1, 0.05, 0.02, 0.01, 0.005, 0.004, 0.002, 0.001}; the SMALLEST angle
# used in the family is atan(0.001) = 0.001000 rad.
# b = (1, 1 + 0.05) and t = (3, 1 + 0.05) put the optimum at the vertex (1, 1) with both rows
# active, multipliers (1, 1). Q = I and step_scale 1.0, so every outer iteration projects t itself:
# the whole fixture is one hard projection.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 1), row1 (multiplier 1).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-10.0, -10.0]
upper = [10.0, 10.0]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1.0]
center = [3.0, 1.05]
constraint_matrix = [1.0, 0.0, 1.0, 0.05]
constraint_rhs = [1.0, 1.05]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [1.0, 1.0]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
