schema_version = 3
fixture_id = "qp-adv-degenerate-box-mid-pinned-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 3
constraints = 1
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: a degenerate box. Coordinate 1 has lo == hi == 0.5 (zero width); the row x0 + x1 + x2 <= 1 must act on the
# remaining two coordinates as x0 + x2 <= 0.5.
# Q = I, step_scale 1.0.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 0.25), hi1 (multiplier 2.25).

[config]
max_iterations = 5000
tolerance = 1e-10
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-5.0, 0.5, -5.0]
upper = [5.0, 0.5, 5.0]
initial = [0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0]
center = [2.0, 3.0, -1.0]
constraint_matrix = [1.0, 1.0, 1.0]
constraint_rhs = [1.0]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [1.75, 0.5, -1.25]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
