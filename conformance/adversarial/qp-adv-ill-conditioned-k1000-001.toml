schema_version = 3
fixture_id = "qp-adv-ill-conditioned-k1000-001"
suite = "adversarial"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 1
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-adversarial", "cluster-reference-adversarial"]
variant = "solve"

# RFC 031 adversarial suite. Stresses: an ill-conditioned Q. Q = diag(1, 1000), condition number 1000.
# The stated condition-number range across this family is 10, 100, 1000. The row x1 <= 1 acts on the STIFF
# coordinate only, so the slow coordinate x0 (curvature 1) converges by plain gradient steps of size
# step_scale = 1/1000 = 1/lambda_max(Q): about kappa * ln(1/tol) outer iterations, a fixed property of the
# method. max_iterations is 50000 for that reason. (A first draft used the oblique row x0 + x1 <= 1; it
# converged in 29 to 34 outer iterations at every kappa because the coupling row makes the step contractive,
# so it stressed nothing and was replaced.)
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 1000).

[config]
max_iterations = 50000
tolerance = 1e-10
step_scale = 0.001
projection_max_sweeps = 100000
projection_tolerance = 1e-10

[problem]
lower = [-10.0, -10.0]
upper = [10.0, 10.0]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1000.0]
center = [2.0, 2.0]
constraint_matrix = [0.0, 1.0]
constraint_rhs = [1.0]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [2.0, 1.0]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
