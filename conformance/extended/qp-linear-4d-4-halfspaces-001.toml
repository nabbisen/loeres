schema_version = 3
fixture_id = "qp-linear-4d-4-halfspaces-001"
suite = "extended"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 4
constraints = 4
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-extended", "cluster-reference-extended"]
variant = "solve"

# RFC 031 extended suite. Stresses: size. n = 4, m = 4 (cluster and device); the smoke corpus stops at
# n = 3, m = 3. Q = diag(1, 1, 1, 1); step_scale 1.0 = 1/max(q).
# Instance: seeded pick (python random.Random(4101), attempt 1) of a random polyhedron with entries in
# tenths, feasible by construction, and a target chosen outside it, kept only because its exact
# optimum has at least 3 active rows.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row1 (multiplier 0.768807), row2 (multiplier 2.20339), row3 (multiplier 0.577122), lo0 (multiplier 3.31344).

[config]
max_iterations = 5000
tolerance = 1e-12
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-13

[problem]
lower = [-2.0, -2.0, -2.0, -2.0]
upper = [2.0, 2.0, 2.0, 2.0]
initial = [0.0, 0.0, 0.0, 0.0]
quadratic_diag = [1.0, 1.0, 1.0, 1.0]
center = [-4.2, -1.3, 5.0, -1.3]
constraint_matrix = [0.8, 0.4, -2.0, 2.0, 0.8, 0.3, 0.5, -1.5, 0.2, -0.8, 1.8, 0.1, 0.1, 0.6, 1.8, 1.8]
constraint_rhs = [0.54, 0.28, -1.15, -3.5]

[expected]
status = "converged"
termination = "convergence-criterion"
solution = [-2.0, -0.11420704845814977, -0.3893171806167401, -1.4059471365638767]
error = "none"
violation_max = 1e-8

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
