# RFC 031 extended suite. Stresses: size. n = 7, m = 4 (cluster only (no device instantiation for this shape)); the smoke corpus stops at
# n = 3, m = 3. Q = diag(1, 1, 1, 1, 1, 1, 1); step_scale 1.0 = 1/max(q).
