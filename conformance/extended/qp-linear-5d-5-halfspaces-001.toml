# RFC 031 extended suite. Stresses: size. n = 5, m = 5 (cluster and device); the smoke corpus stops at
# n = 3, m = 3. Q = diag(1, 1, 1, 1, 1); step_scale 1.0 = 1/max(q).
# Instance: seeded pick (python random.Random(5101), attempt 0) of a random polyhedron with entries in
# tenths, feasible by construction, and a target chosen outside it, kept only because its exact
# optimum has at least 3 active rows.
#
# Exact reference (fractions.Fraction, active-set enumeration over the rows AND the box
# faces, in Q's metric; no kernel run). Active set at the optimum: row0 (multiplier 1.96459), row1 (multiplier 0.562527), row3 (multiplier 0.297968), row4 (multiplier 0.814395).

