schema_version = 3
fixture_id = "qp-linear-2d-hot-loop-nan-001"
suite = "smoke"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 1
scalar_family = "float"
validation_state = "trusted-by-caller"
conformance_groups = ["cluster-reference-smoke"]
variant = "solve"

# A non-finite center with the scans trusted away reaches the hot loop, where
# the in-loop finiteness check is never skippable: NumericalDomain, never Solved.

[config]
max_iterations = 5000
tolerance = 1e-12
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-13

[problem]
lower = [-10.0, -10.0]
upper = [10.0, 10.0]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1.0]
center = [nan, nan]
constraint_matrix = [1.0, 1.0]
constraint_rhs = [1.0]

[expected]
status = "error"
termination = "not-applicable"
solution = []
error = "numerical-domain"

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
