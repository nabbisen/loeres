schema_version = 3
fixture_id = "qp-linear-2d-zero-row-001"
suite = "smoke"
problem_class = "box_quadratic_linear_inequalities"
solver_family = "constrained_projected_first_order"
dimension = 2
constraints = 1
scalar_family = "float"
validation_state = "validate-all-inputs"
conformance_groups = ["device-reference-smoke", "cluster-reference-smoke"]
variant = "solve"

# An all-zero constraint row a_i = 0 is InvalidInput (a zero-row *matrix*, m = 0,
# is valid and is not this case).

[config]
max_iterations = 5000
tolerance = 1e-12
step_scale = 1.0
projection_max_sweeps = 100000
projection_tolerance = 1e-13

[problem]
lower = [-10.0, -10.0]
upper = [10.0, 10.0]
initial = [0.0, 0.0]
quadratic_diag = [1.0, 1.0]
center = [0.0, 0.0]
constraint_matrix = [0.0, 0.0]
constraint_rhs = [1.0]

[expected]
status = "error"
termination = "not-applicable"
solution = []
error = "invalid-input"

[tolerance]
solution_abs = 0.000001
solution_rel = 0.000001
