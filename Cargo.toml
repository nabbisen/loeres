[workspace]
resolver = "3"
members = [
    "crates/loeres",
    "crates/loeres-backend-std",
    "crates/loeres-backend-static",
    "crates/loeres-cluster",
    "crates/loeres-device",
    "xtask",
]

# RFC 023 §11.1: the examples are deliberately NOT members. As members they
# would share one lockfile and participate in feature unification, so a device
# example could resolve cluster-side crates through a sibling and still compile
# — the isolation claim would be an artifact of the build graph rather than a
# property of the example. Excluded, each example's resolved graph is its own
# evidence, which is what `cargo xtask examples` asserts.
exclude = [
    "examples/cluster-batch-solve",
    "examples/device-box-pfo",
]

# Shared metadata inherited by every member via `field.workspace = true`.
# Member crates expose implemented public APIs through RFCs 001-026. Repository
# state alone does not establish external registry publication; workspace
# metadata and CHANGELOG.md define the release-local version baseline.
[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["nabbisen"]
repository = "https://github.com/nabbisen/loeres"

# Internal path dependencies, so members write `loeres = { workspace = true }`.
[workspace.dependencies]
loeres                      = { version = "0", path = "crates/loeres" }
loeres-backend-std          = { version = "0", path = "crates/loeres-backend-std" }
loeres-backend-static       = { version = "0", path = "crates/loeres-backend-static" }
loeres-cluster              = { version = "0", path = "crates/loeres-cluster" }
loeres-device               = { version = "0", path = "crates/loeres-device" }

# Shared external dependencies. Versions are centralized here; members write
# `dep = { workspace = true, optional = true }` and add crate-specific features only.
rayon                       = { version = "1" }
serde                       = { version = "1", features = ["derive"] }
tokio                       = { version = "1", default-features = false, features = ["rt"] }
toml                        = { version = "0.8" }
