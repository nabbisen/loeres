name: release

on:
  push:
    # GitHub ref filters are globs. The gate independently parses exact stable
    # SemVer and rejects malformed lookalikes before any artifact phase.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399 # 1.85.0

      - name: Install the pinned documentation tool
        run: cargo +stable install mdbook --version 0.5.4 --locked

      - name: Record tool versions
        run: |
          rustc +stable --version --verbose
          rustc +1.85.0 --version --verbose
          mdbook --version

      - name: Run the canonical non-publishing candidate gate
        run: cargo +stable xtask release-gate

      - name: Retain non-publishing candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loeres-release-evidence-${{ github.sha }}
          path: .git-exclude/release-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      # RFC 019 creates no GitHub release and performs no registry publication.
