name: msrv
on:
  push:
    branches: [main]
  pull_request:
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Rust 2024 edition minimum supported version.
      - uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399 # 1.85.0
      - run: cargo check --workspace --all-features
