name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace --all-features
  gates:
    # RFC 045 S1 (review 108 §4): the full twenty-gate aggregate, on every
    # push and PR, not just the two gates (`zero-bleed`, `supply-chain`) this
    # job used to name individually. Named `gates`, not `xtask-check` —
    # this project calls them "20 gates"/`GateKind` everywhere, and a name
    # starting with `check` reads as a duplicate of `check-test` in a PR's
    # job list. `no-std` is covered twice now (also by `no-std.yml`), which
    # is cheap; `msrv.yml` stays separate since it pins a different
    # toolchain this job does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: thumbv7em-none-eabihf
      # Pinned: the gate fails when cargo-deny is absent (RFC 026 §11), so the
      # version that enforces policy is part of the reviewed environment rather
      # than whatever the runner happens to resolve. The pin is a hash now, not
      # only a version (RFC 046) — installed by verified identity rather than
      # rebuilt from source on every run.
      - uses: ./.github/actions/install-pinned-tool
        with:
          tool: cargo-deny
      - run: cargo deny --version
      - run: cargo xtask check
