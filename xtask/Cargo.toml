[package]
name = "xtask"
description = "Loeres repository automation: dependency-direction, no_std, and release gates. Never a dependency of any library crate."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
publish = false

[dependencies]
loeres = { workspace = true }
loeres-backend-static = { workspace = true, features = ["owned-arrays"] }
loeres-backend-std = { workspace = true }
loeres-cluster = { workspace = true }
loeres-device = { workspace = true, features = ["owned-arrays"] }
serde = { workspace = true }
toml = { workspace = true }
